name: Validate pinned overlay experiment

on:
  push:
    branches:
      - experiment/github-pinned-overlay-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-build:
    name: Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
